# Benchmark registry for the aggregate. One loader per key in harmfloor/data/.
#
# status: todo -> sourced (raw files + license recorded) -> loaded (emits schema.Item) -> validated
# redistribute: conditional = text sharing supported subject to redistribution_note;
# TBC = full-text redistribution is unresolved, not a finding that it is prohibited.
# license records the publisher's declaration; license_scope distinguishes code/data.
# evidence links support the recorded terms or identify the pages checked for missing terms.
# Licence audit: 2026-10-22. JBB and SafeDialBench EN acquired on 2026-10-23;
# per-entry statuses track acquisition, loading and validation separately.
# Pin source revisions when acquiring data. Do not apply one licence to the whole aggregate.

core:  # the four papers the revision is built on
  jailbreakradar:
    paper: "Chu et al., JailbreakRadar, ACL 2025 (aclanthology 2025.acl-long.1045)"
    provides: "160 forbidden questions x 16 violation categories; 17 attacks in 6 families"
    role: [attack_family_axis, prompts]
    url: https://github.com/TrustAIRLab/JailbreakRadar
    data_url: https://github.com/TrustAIRLab/JailbreakRadar/tree/main/forbidden_questions
    license: TBC
    redistribute: TBC
    redistribution_note: "No explicit dataset licence found in the checked repository/README. Ask maintainers about the forbidden questions and any redistributed attack artifacts."
    evidence:
      - https://github.com/TrustAIRLab/JailbreakRadar/blob/main/README.md
      - https://github.com/TrustAIRLab/JailbreakRadar/tree/main/forbidden_questions
    status: todo
  sok_guardrails:
    paper: "Wang et al., SoK: Evaluating Jailbreak Guardrails for LLMs (arXiv 2506.10597)"
    provides: "guardrail taxonomy (6 dims), 13 guardrail configs, SEU metrics, attack prompts"
    role: [defense_axis, prompts, utility]
    url: https://github.com/xunguangwang/SoK4JailbreakGuardrails
    data_url: https://huggingface.co/datasets/xunguangwang/JailbreakGuardrailBenchmark
    license: MIT
    license_scope: "Dataset card declaration; component datasets retain their own terms. No repository-wide code licence found in the checked GitHub root/README."
    redistribute: TBC
    redistribution_note: "Do not treat the combined dataset as uniformly MIT. Resolve terms per component; notably the upstream AlpacaEval card declares CC-BY-NC-4.0."
    evidence:
      - https://huggingface.co/datasets/xunguangwang/JailbreakGuardrailBenchmark
      - https://huggingface.co/datasets/tatsu-lab/alpaca_eval
      - https://github.com/xunguangwang/SoK4JailbreakGuardrails
    status: todo
  safedialbench:
    paper: "Cao et al., SafeDialBench (arXiv 2502.11090)"
    provides: "4,053 EN/ZH dialogues, 3-10 turns, 6 safety dims, 7 attack strategies"
    role: [multi_turn, prompts]
    url: https://safedialbench.github.io/
    data_url: https://huggingface.co/datasets/HongyeCao/SafeDialBench
    english_data_url: https://github.com/drivetosouth/SafeDialBench-Dataset/blob/main/data/complete/datasets_en.jsonl
    license: Apache-2.0
    license_scope: "Declared in the raw Hugging Face card only among the checked sources; no explicit dataset licence found in the GitHub root/README."
    redistribute: conditional
    redistribution_note: "For the Hugging Face dataset release, include the Apache-2.0 licence, retain applicable notices, mark modified files and preserve any supplied NOTICE attributions. Verify that any GitHub copy used matches the licensed release."
    evidence:
      - https://github.com/drivetosouth/SafeDialBench-Dataset
      - https://huggingface.co/datasets/HongyeCao/SafeDialBench/tree/main
      - https://huggingface.co/datasets/HongyeCao/SafeDialBench/raw/main/README.md
      - https://www.apache.org/licenses/LICENSE-2.0
    note: "Use English split for the main grid. Re-judge with our judge; do not reuse their 1-10 scores. The 2,037-row release has no harm labels or standalone intents, so each dialogue's harm_domain, intent and harmful/benign/excluded disposition is reviewed per item in annotations_en.json (team decision 2026-10-23); protective dialogues are kept as is_benign for the FPR test. Dialogue 645 has a whitespace-only user turn and needs explicit review/exclusion. See docs/DATA_LOADERS.md."
    source_revision: 0d27436754b80c28d40c3748ede8e498405a63a8
    source_sha256: a5429b6477ab7d3f6e47da55e0a9c889bbbba7575dd2ba7e1672379a412bc988
    status: sourced
  multibreak:
    paper: "Song et al., MultiBreak (arXiv 2605.01687, ICML 2026)"
    provides: "10,389 multi-turn prompts, 2,665 intents, 2-6 turns, 7 attack categories, 26 safety categories"
    role: [multi_turn, prompts]
    url: TBC
    paper_url: https://arxiv.org/abs/2605.01687
    license: TBC
    redistribute: TBC
    redistribution_note: "The author's homepage announces a Hugging Face dataset release in September 2026, but its news source links to '#' as a placeholder. No verified public release located in the checked pages or Hugging Face search as of 2026-10-22. Request the actual release URL and dataset terms; the paper's CC-BY-4.0 licence does not establish dataset permissions."
    evidence:
      - https://arxiv.org/html/2605.01687v1
      - https://proceedings.mlr.press/v306/song26n.html
      - https://jsong2333333.github.io/
      - https://github.com/jsong2333333/jsong2333333.github.io/blob/main/_news/2026-09-multibreak-dataset.md
      - https://huggingface.co/papers/2605.01687
    status: todo

