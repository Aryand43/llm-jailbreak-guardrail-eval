# Unified taxonomy and crosswalks. Source of truth for the vertical axis of the study.
#
# attack_families: JailbreakRadar (Chu et al., ACL 2025) six mechanism families, plus
#   `direct` (plain harmful request, the no-attack reference row) and `multi_turn` (our
#   extension: JailbreakRadar is single-turn only).
# harm_domains: coarse domains that every benchmark's native harm labels map onto.
#
# Mappings marked `review: true` are proposals; validate them on ~20 items each before freezing.

attack_families:
  direct: "No jailbreak; the harmful intent asked plainly."
  human_based: "Hand-written jailbreak templates (AIM, DevMode, in-the-wild prompts)."
  obfuscation_based: "Intent hidden by encoding, translation or decomposition."
  heuristic_based: "Template search by genetic / fuzzing heuristics."
  feedback_based: "Optimised against target feedback (gradients or attacker-LLM loops)."
  fine_tuning_based: "Prompts generated by a fine-tuned attacker model."
  generation_parameter_based: "Decoding-configuration exploitation."
  multi_turn: "Intent spread across turns (escalation, role/scene, reference)."

harm_domains:
  - violence_weapons
  - cbrn
  - cyber
  - fraud_economic
  - hate_harassment
  - self_harm
  - sexual_content
  - child_safety
  - privacy
  - misinformation_political
  - regulated_advice
  - ai_system_misuse
  - other_illicit

# native attack method -> family, per source
attack_crosswalk:
  jailbreakradar:
    AIM: human_based
    DevMode-Ranti: human_based
    DevMode-v2: human_based
    Base64: obfuscation_based
    Combination: obfuscation_based
    Zulu: obfuscation_based
    DrAttack: obfuscation_based
    AutoDAN: heuristic_based
    GPTFuzz: heuristic_based
    LAA: heuristic_based
    GCG: feedback_based
    COLD: feedback_based
    PAIR: feedback_based
    TAP: feedback_based
    MasterKey: fine_tuning_based
    AdvPrompter: fine_tuning_based
    GE: generation_parameter_based
  sok_guardrails:  # Wang et al. 2025 attack set, re-filed under JailbreakRadar families
    IJP: human_based
    GCG: feedback_based
    AutoDAN: heuristic_based
    TAP: feedback_based
    LLM-Fuzzer: heuristic_based
    DrAttack: obfuscation_based
    MultiJail: obfuscation_based  # low-resource-language translation
    ActorAttack: multi_turn
    X-Teaming: multi_turn
  neurips_curated_cyber:
    curated_cyber: human_based  # educational / role-play framing, hand-written
  safedialbench:  # Aryan approved all seven families, 2026-10-27 (D9)
    Reference Attack: {family: multi_turn, review: false}
    Scene Construct: {family: multi_turn, review: false}  # alias of native Scence Construct
    Probing Question: {family: multi_turn, review: false}
    Topic Change: {family: multi_turn, review: false}
    Purpose Reverse: {family: multi_turn, review: false}
    Role Play: {family: multi_turn, review: false}
    Fallacy Attack: {family: multi_turn, review: false}
  direct_sources: [jbb_behaviors, harmbench, strongreject, pku_saferlhf, or_bench, xstest]

# multi-turn strategies -> shared strategy tags (secondary axis inside `multi_turn`)
strategy_crosswalk:
  multibreak:
    Multi-Turn Escalation: escalation
    Role and Scene Manipulation: role_scene
    Obfuscation and Encoding: obfuscation
    Output Format and Manipulation: output_format
    Framing, Authority and Emotional Pressure: framing_pressure
    Logical Exploits: logical_exploit
    Injection and Mandates: injection
  safedialbench:  # D9: provisional tags allowed for family-level analysis only
    Purpose Reverse: {tag: logical_exploit, review: false}  # Aryan, 2026-10-27
    Scene Construct: {tag: role_scene, review: true}  # native spelling remains in native_labels
    Role Play: {tag: role_scene, review: true}  # some items are first-person story, no role assigned
    Topic Change: {tag: escalation, review: true}  # some items stay on one subject
    Fallacy Attack: {tag: logical_exploit, review: true}  # some items critique the false premise
    Reference Attack: {tag: escalation, review: true}
    Probing Question: {tag: escalation, review: true}

# native harm label -> harm domain, per source.
# jbb_behaviors and safedialbench are NOT here: their categories mix domains / ship no detailed
# labels, so each item's harm_domain is reviewed directly in its annotation file, not mapped from
# a native label. Aryan approved per-item requested-harm labelling on 2026-10-27 (D7).
# See harmfloor/data/annotations.py and docs/ANNOTATION.md.
harm_crosswalk:
  jailbreakradar:
    Illegal Activities: other_illicit
    Hate, Unfairness or Harassment: hate_harassment
    Terrorist Content: violence_weapons
    Disinformation Spread: misinformation_political
    Privacy Breach: privacy
    Physical Harm: violence_weapons
    Malicious Software: cyber
    Safety Filter Bypass: ai_system_misuse
    Third-party Rights Violation: other_illicit
    Risky Government Decisions: regulated_advice
    Unauthorized Practice: regulated_advice
    Well-being Infringement: {domain: self_harm, review: true}
    Adult Content: sexual_content
    Political Activities: misinformation_political
    Impersonation: fraud_economic
    AI Usage Disclosure: ai_system_misuse
  multibreak:
    Violence: violence_weapons
    Extremism: violence_weapons
    Weapons: violence_weapons
    ChemBio: cbrn
    Child: child_safety
    Adult: sexual_content
    Animal: other_illicit
    Hate: hate_harassment
    SelfHarm: self_harm
    Malware: cyber
    Intrusion: cyber
    Phishing: cyber
    Privacy: privacy
    Scams: fraud_economic
    Fraud: fraud_economic
    Theft: fraud_economic
    IP: other_illicit
    Order: other_illicit
    Misinform: misinformation_political
    Medical: regulated_advice
    Legal: regulated_advice
    Finance: regulated_advice
    TechAdvice: {domain: regulated_advice, review: true}
    Politics: misinformation_political
    AI: ai_system_misuse
    Illicit: other_illicit
  excluded: {}  # per-source native labels excluded from harm floors; none while jbb/safedial
                # exclusions are decided per item in their annotation files

# Defense taxonomy: SoK (Wang et al. 2025) dimensions plus our theory class and budget knob q.
# theory_class links each guardrail to the filter classes of the NeurIPS theory.
defense_dimensions: [stage, paradigm, granularity, reactiveness, access, explainability]
