[project]
name = "harmfloor"
version = "0.1.0"
description = "Bound-based evaluation of residual jailbreak harm across attack taxonomies, benchmarks and guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harmfloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
